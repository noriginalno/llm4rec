[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sweettv-midterm"
version = "0.1.0"
description = "Temporal, repeat-aware TV program recommendation benchmark"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["sweettv*", "research_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
